[package]
name = "wizardchat-core-ffi"
description = "Carries wizardchat-core RPC calls between the native apps (iOS, Android) and the core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "wizardchat_core_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
wizardchat-core = { path = "../core" }
uniffi = "0.32.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android has no system SQLite for apps, and checks certificates through the JVM
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
rustls-platform-verifier = "0.7"
jni = "0.22"
# logcat, for the core's logs
ndk-sys = "0.6"

[features]
bindgen = ["uniffi/cli"]
