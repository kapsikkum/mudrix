[package]
name = "wizardchat-core-wasm"
description = "Carries wizardchat-core RPC calls between the web app and the core compiled to wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wizardchat-core = { path = "../core" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
serde_json = "1"
console_error_panic_hook = "0.1.7"
tracing-wasm = "0.2.1"
tracing = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
