name: iOS

# Compile check (and unit tests) for the iOS Simulator, no signing. macOS minutes cost 10x: this only runs when iOS,
# core or shared-package files change, or by hand (Actions -> iOS -> Run workflow).
# The raw xcodebuild logs are uploaded whether or not the build passes.
on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/ios.yml
      - .github/actions/setup-rust/**
  pull_request:
    paths:
      - apps/ios/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/ios.yml
      - .github/actions/setup-rust/**
  workflow_dispatch:
    inputs:
      xcode-version:
        description: Xcode version to select (must ship the iOS 18 SDK or newer)
        default: '26'
        type: string
      run-tests:
        description: Run the XCTest target after the build
        default: true
        type: boolean
      device-ipa:
        description: Also build an unsigned device IPA for SideStore (no signing, no Apple account)
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  XCODE_VERSION: ${{ inputs.xcode-version || '26' }}
  RUN_TESTS: ${{ github.event_name == 'workflow_dispatch' && !inputs.run-tests && 'false' || 'true' }}
  # The project and its scheme are named after `name:` in apps/ios/project.yml. Leave the repository
  # variables IOS_XCODEPROJ / IOS_SCHEME unset and the "Resolve names" step reads them from the project
  # xcodegen just generated, so this workflow survives a rename in either direction; set the variables
  # to pin them.
  IOS_XCODEPROJ: ${{ vars.IOS_XCODEPROJ }}
  IOS_XCODE_SCHEME: ${{ vars.IOS_SCHEME }}
  # GIF search (docs/SECRETS.md): project.yml copies these into Info.plist at build time
  GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
  KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

defaults:
  run:
    # Explicit shell: bash runs with -eo pipefail, so `cmd | tee log` still fails when cmd does
    shell: bash

jobs:
  build:
    name: Simulator build + tests (unsigned)
    # macos-26 = Apple silicon, Xcode 26 (needed for the Icon Composer .icon app icons). Pinned instead of macos-latest so the image doesn't change under us.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim
          cache-key: ios

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Tools (xcodegen, xcbeautify)
        run: |
          mkdir -p ci-logs
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          brew list xcbeautify > /dev/null 2>&1 || brew install xcbeautify || true
          {
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            swift --version
            xcodegen --version
          } 2>&1 | tee ci-logs/versions.log

      - run: npm ci --ignore-scripts

      # tokens, translations, emoji and icons: project.yml pulls packages/*/dist into the app
      - name: Shared assets
        run: npm run assets

      # Debug profile, aarch64-apple-ios + aarch64-apple-ios-sim, UniFFI Swift bindings, XCFramework
      - name: Build the core for iOS (debug, simulator)
        if: ${{ !inputs.device-ipa }}
        run: apps/ios/scripts/build-core.sh --debug 2>&1 | tee ci-logs/build-core.log

      - name: Build the core for iOS (release, device IPA)
        if: ${{ inputs.device-ipa }}
        run: apps/ios/scripts/build-core.sh 2>&1 | tee ci-logs/build-core.log

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate 2>&1 | tee ../../ci-logs/xcodegen.log

      # One place that knows the project/scheme names: whatever xcodegen just generated, unless pinned.
      - name: Resolve names
        run: |
          if [ -n "$IOS_XCODEPROJ" ]; then
            IOS_PROJECT="$IOS_XCODEPROJ"
          else
            IOS_PROJECT="$(basename "$(ls -d apps/ios/*.xcodeproj | head -1)")"
          fi
          if [ -n "$IOS_XCODE_SCHEME" ]; then IOS_SCHEME="$IOS_XCODE_SCHEME"; else IOS_SCHEME="${IOS_PROJECT%.xcodeproj}"; fi
          echo "IOS_PROJECT=$IOS_PROJECT" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$IOS_SCHEME" >> "$GITHUB_ENV"
          echo "project=$IOS_PROJECT scheme=$IOS_SCHEME"

      - name: Cache Swift packages (LiveKit)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml') }}

      - name: Pick an iOS 18+ simulator
        run: |
          xcrun simctl list devices available --json > ci-logs/simulators.json
          python3 - <<'PY' | tee sim.env
          import json, sys
          runtimes = json.load(open("ci-logs/simulators.json"))["devices"]
          best = None
          for runtime, devices in runtimes.items():
              if "iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-") if p.isdigit())
              if version < (18,):
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      cand = (version, d["name"], d["udid"])
                      if best is None or cand > best:
                          best = cand
          if best is None:
              sys.exit("no iPhone simulator with an iOS 18+ runtime is available; see ci-logs/simulators.json")
          print("SIM_ID=%s" % best[2])
          print("SIM_NAME=%s (iOS %s)" % (best[1], ".".join(map(str, best[0]))), file=sys.stderr)
          PY
          cat sim.env >> "$GITHUB_ENV"

      - name: xcodebuild build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build \
            -resultBundlePath ../../ci-logs/build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            GIPHY_API_KEY="$GIPHY_API_KEY" KLIPY_API_KEY="$KLIPY_API_KEY" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee ../../ci-logs/xcodebuild-build.log \
            | { if command -v xcbeautify > /dev/null; then xcbeautify; else cat; fi; }

      - name: xcodebuild test
        if: env.RUN_TESTS == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build \
            -resultBundlePath ../../ci-logs/test.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            GIPHY_API_KEY="$GIPHY_API_KEY" KLIPY_API_KEY="$KLIPY_API_KEY" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee ../../ci-logs/xcodebuild-test.log \
            | { if command -v xcbeautify > /dev/null; then xcbeautify; else cat; fi; }

      # The first iOS compile ever: put every distinct error into the run summary so one run shows the whole list
      - name: Error summary
        if: always()
        run: |
          {
            echo '### Compiler and linker errors'
            echo '```'
            grep -hE '(: error:|^error:|ld: |Undefined symbols|BUILD FAILED|TEST FAILED|\*\* .* FAILED \*\*)' ci-logs/*.log 2> /dev/null | sort -u | head -400 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Unzip and drop into a booted Simulator: the app on disk is named after the target, not "Mudrix".
      - name: Package the Simulator app
        id: simulator-app
        if: always() && hashFiles('apps/ios/build/Build/Products/Debug-iphonesimulator/*.app/Info.plist') != ''
        run: |
          set -euo pipefail
          mkdir -p ci-logs/simulator
          apps=(apps/ios/build/Build/Products/Debug-iphonesimulator/*.app)
          APP="${apps[0]}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "ci-logs/simulator/$(basename "$APP" .app)-simulator-${GITHUB_SHA::7}.zip"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" > ci-logs/simulator/bundle-id.txt
          echo "IOS_BUNDLE_ID=$(cat ci-logs/simulator/bundle-id.txt)" >> "$GITHUB_ENV"
          echo "bundle-id=$(cat ci-logs/simulator/bundle-id.txt)" >> "$GITHUB_OUTPUT"
          ls -lh ci-logs/simulator

      # Boots the simulator the build already used, installs the unsigned app and takes two screenshots
      # (light and dark) so a run shows the UI instead of only a log. Anything the app needs a
      # homeserver for is not covered: this is the first screen after launch.
      - name: Screenshots in the Simulator
        if: always() && steps.simulator-app.outputs.bundle-id != ''
        run: |
          set -euo pipefail
          mkdir -p screenshots
          apps=(apps/ios/build/Build/Products/Debug-iphonesimulator/*.app)
          APP="${apps[0]}"
          xcrun simctl boot "$SIM_ID" 2> /dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # an unsigned build usually installs on the Simulator; an ad-hoc signature makes it deterministic
          codesign --force --deep --sign - "$APP"
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl status_bar "$SIM_ID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl launch "$SIM_ID" "$IOS_BUNDLE_ID"
          sleep 10
          xcrun simctl io "$SIM_ID" screenshot screenshots/01-launch-light.png
          xcrun simctl ui "$SIM_ID" appearance dark
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot screenshots/02-launch-dark.png
          ls -lh screenshots

      # An unsigned device build for SideStore/AltStore: it signs the app on the phone with the user's own
      # Apple ID, so this needs no team, no certificate and no Apple Developer account.
      - name: xcodebuild build (device, unsigned)
        if: inputs.device-ipa
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build-device \
            -resultBundlePath ../../ci-logs/build-device.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            GIPHY_API_KEY="$GIPHY_API_KEY" KLIPY_API_KEY="$KLIPY_API_KEY" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee ../../ci-logs/xcodebuild-device.log \
            | { if command -v xcbeautify > /dev/null; then xcbeautify; else cat; fi; }

      - name: Package the unsigned IPA
        if: inputs.device-ipa
        run: |
          set -euo pipefail
          apps=(apps/ios/build-device/Build/Products/Release-iphoneos/*.app)
          test -n "${apps[0]:-}"
          APP="${apps[0]}"
          echo "app=$(basename "$APP")"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist"
          items=(NSMicrophoneUsageDescription NSCameraUsageDescription)
          for key in "${items[@]}"; do
            plutil -extract "$key" raw "$APP/Info.plist" > /dev/null
          done
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Mudrix-unsigned.ipa Payload)
          shasum -a 256 Mudrix-unsigned.ipa | tee Mudrix-unsigned.ipa.sha256
          ls -lh Mudrix-unsigned.ipa

      - name: Upload the unsigned IPA
        if: inputs.device-ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mudrix-ios-unsigned-ipa
          path: |
            Mudrix-unsigned.ipa
            Mudrix-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Simulator app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-app
          path: ci-logs/simulator/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-xcodebuild-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
