name: Android

# Compile check + unit tests for the fdroid flavour (no Google/Firebase code, so no secrets or google-services needed),
# and a debug APK as an artifact. The gplay flavour needs Firebase config we don't have and is not built here.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
      - .github/actions/setup-rust/**
  pull_request:
    paths:
      - apps/android/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
      - .github/actions/setup-rust/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Same versions as upstream's build-android job
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0

jobs:
  build:
    name: fdroid debug build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android x86_64-linux-android
          cache-key: android

      - name: Install the Android SDK packages and NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          # build-core.sh otherwise takes the newest NDK it finds; pin the one we installed
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --ignore-scripts

      # tokens, translations, emoji and icons: the Gradle build reads packages/*/dist
      - name: Shared assets
        run: npm run assets

      # Debug profile (fast), arm64-v8a + x86_64; installs cargo-ndk on first use
      - name: Build the core for Android
        run: apps/android/scripts/build-core.sh --debug --all

      - name: assembleFdroidDebug
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mudrix-android-fdroid-debug
          path: apps/android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
