name: Android

# Compile check + unit tests for the fdroid flavour (no Google/Firebase code, so no secrets or google-services needed),
# and a debug APK as an artifact. The gplay flavour needs Firebase config we don't have and is not built here.
# Only a run started from the v<package.json version> tag builds and signs the release APK; branch pushes
# (including web-look) and pull requests stay unsigned debug builds.
on:
  push:
    # `web-look` is the branch people test from; a push there should always leave a fresh APK behind.
    # (The path filter below still applies: web-only or docs-only commits don't rebuild the app.)
    branches: [main, next, web-look]
    paths:
      - apps/android/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
      - .github/actions/setup-rust/**
  pull_request:
    paths:
      - apps/android/**
      - crates/**
      - packages/**
      - whatsnew/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
      - .github/actions/setup-rust/**
  workflow_dispatch:
  # Called by release.yml on a version tag.
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      VITE_GIPHY_API_KEY:
        required: false
      VITE_KLIPY_API_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Same versions as upstream's build-android job
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  # GIF search (docs/SECRETS.md): Gradle reads these from the environment into BuildConfig
  GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
  KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

jobs:
  build:
    name: fdroid debug build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Signing is for the release only: a branch push (main, web-look) must leave an unsigned debug
      # APK, and the tag has to be exactly v<package.json version> (RELEASING.md).
      - name: Release tag check
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" = "v$version" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release build of v$version."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Not the v$version tag (ref: ${GITHUB_REF:-unset}); the build stays an unsigned debug APK."
          fi

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android x86_64-linux-android
          cache-key: android

      - name: Install the Android SDK packages and NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          # build-core.sh otherwise takes the newest NDK it finds; pin the one we installed
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: npm ci --ignore-scripts

      # tokens, translations, emoji and icons: the Gradle build reads packages/*/dist
      - name: Shared assets
        run: npm run assets

      # Debug profile (fast) for the debug APK and the unit tests.
      - name: Build the core for Android
        run: apps/android/scripts/build-core.sh --debug --all

      - name: assembleFdroidDebug
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      # A release-signed APK (package chat.mudrix.mobile) when the run is for the version tag and the
      # signing secrets exist. Unversioned branch runs and pull requests never get it: signing is for
      # exactly the bytes attached to a release.
      - name: Prepare release signing
        id: signing
        if: steps.release.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            node tools/ci/sign-android.mjs prepare
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Android signing secrets; skipping the signed release APK."
          fi

      # The release APK ships a release core: the debug one above is for tests only and would make the
      # download several times bigger and slower.
      - name: Build the release core
        if: steps.release.outputs.enabled == 'true' && steps.signing.outputs.enabled == 'true'
        run: apps/android/scripts/build-core.sh --all

      - name: assembleFdroidRelease (signed)
        if: steps.release.outputs.enabled == 'true' && steps.signing.outputs.enabled == 'true'
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:assembleFdroidRelease

      - name: Verify the release signature
        if: steps.release.outputs.enabled == 'true' && steps.signing.outputs.enabled == 'true'
        run: |
          node tools/ci/sign-android.mjs verify \
            apps/android/app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Name the signed APK and checksum it
        if: steps.release.outputs.enabled == 'true' && steps.signing.outputs.enabled == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          cd apps/android/app/build/outputs/apk/fdroid/release
          mv app-fdroid-release.apk "Mudrix-${version}-release.apk"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the signed release APK
        if: steps.release.outputs.enabled == 'true' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mudrix-android-fdroid-release
          path: |
            apps/android/app/build/outputs/apk/fdroid/release/*.apk
            apps/android/app/build/outputs/apk/fdroid/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Checksums
        working-directory: apps/android/app/build/outputs/apk/fdroid/debug
        run: sha256sum *.apk > SHA256SUMS.txt

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mudrix-android-fdroid-debug
          path: |
            apps/android/app/build/outputs/apk/fdroid/debug/*.apk
            apps/android/app/build/outputs/apk/fdroid/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # The keystore and keystore.properties are written for the signed build only; neither may survive
      # the job, even when a step failed. (A failed checkout has no script, and no files to remove.)
      - name: Remove the signing files
        if: always()
        shell: bash
        run: |
          if [ -f tools/ci/sign-android.mjs ]; then node tools/ci/sign-android.mjs clean; fi
