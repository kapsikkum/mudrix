name: Branding gate

# Fails when "wizardchat" appears somewhere users can see it (translations, READMEs, docs, store/manifest labels).
# Allow-list and the list of scanned places: tools/ci/branding-allow.txt and tools/ci/branding-gate.mjs.
# Once the internal rename is done, switch the command to `--strict` (scans every tracked text file).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Scan user-visible text
        run: node tools/ci/branding-gate.mjs
