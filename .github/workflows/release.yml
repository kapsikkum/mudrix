name: Release

# A tag does the whole release: v26.12.6 builds the signed desktop installers, the signed Android
# APK, the unsigned iOS IPA and the Flatpak on the tag, assembles the release assets (including
# latest.json and SHA256SUMS) with tools/ci/assemble-release.mjs, and publishes the GitHub release
# with the notes from whatsnew/<version>.md. Nothing is built or published for a branch or a pull
# request: every signing secret is only reachable through this workflow's tag run.
#
# A tag with a '-' is a pre-release (v26.12.6-next.1): it must be reachable from `next`, it is
# published as a pre-release and never as "latest", it leaves out the msi/deb/rpm and it ships no
# latest.json, so the desktop updater never offers it. A stable tag must be reachable from `main`.
#
# Re-running a failed release: Actions -> Release -> Run workflow with the tag, and `replace` when
# the release already exists. `main` is the source of truth for the version: the tag and
# package.json must agree.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and publish again, for example v26.12.6'
        required: true
        type: string
      replace:
        description: 'Upload the assets to an existing release instead of failing on it'
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag's commit, and the history the reachability check needs.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: The tag matches package.json and the right branch
        id: check
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::$tag is not a version tag (v<year>.<month>.<n>[-next.<n>])"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$tag" ]; then
            echo "::error::the tag is $tag but package.json says $version; set the version in a release commit first"
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            branch=next
            prerelease=true
          else
            branch=main
            prerelease=false
          fi
          if ! git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
            echo "::error::origin/$branch does not exist; a $([ "$prerelease" = true ] && echo pre-release || echo stable) release must come from $branch"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$branch"; then
            echo "::error::$tag is not on origin/$branch; push the release commit to $branch first"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "$tag is on origin/$branch; building a $([ "$prerelease" = true ] && echo pre-release || echo stable release)."

  desktop:
    name: Desktop
    needs: check-tag
    uses: ./.github/workflows/desktop.yml
    with:
      profile: release
    secrets: inherit

  android:
    name: Android
    needs: check-tag
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    name: iOS
    needs: check-tag
    uses: ./.github/workflows/ios.yml
    with:
      device-ipa: true
    secrets: inherit

  flatpak:
    name: Flatpak
    needs: check-tag
    uses: ./.github/workflows/flatpak.yml

  publish:
    name: Publish the release
    needs: [check-tag, desktop, android, ios, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # The only job that may write: it creates the release and uploads its assets.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check-tag.outputs.tag }}
      VERSION: ${{ needs.check-tag.outputs.version }}
      PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
      # Optional: a token for kapsikkum/apps, so the F-Droid and SideStore repos refresh themselves.
      APPS_REPO_TOKEN: ${{ secrets.APPS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check-tag.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # One directory per artifact, exactly the tree assemble-release.mjs reads.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Assemble the release assets
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          node tools/ci/assemble-release.mjs \
            --artifacts artifacts --out release \
            --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}"

      - name: Write the release body from the in-app notes
        run: |
          set -euo pipefail
          notes="whatsnew/$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing; write the release notes first"
            exit 1
          fi
          # Drop the front matter, keep the Markdown the app shows.
          sed '1{/^---$/!q};1,/^---$/d' "$notes" > body.md
          cat body.md

      - name: Create the release
        if: ${{ inputs.replace != true }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "Mudrix $VERSION" \
            --notes-file body.md \
            "${flags[@]}" \
            release/*

      - name: Replace the assets of an existing release
        if: ${{ inputs.replace == true }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --title "Mudrix $VERSION" --notes-file body.md

      # Advisory: creating a release does not notify kapsikkum/apps, and its own schedule only runs
      # every 6 hours. Without the token this step is skipped, never failed.
      - name: Refresh the F-Droid and SideStore repos
        if: ${{ env.APPS_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.APPS_REPO_TOKEN }}
        run: gh workflow run update.yml -R kapsikkum/apps
