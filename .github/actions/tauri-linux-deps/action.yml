name: Tauri system libraries (Linux)
description: Installs the libraries Tauri v2 and the desktop crate's X11 code need on Ubuntu.

runs:
  using: composite
  steps:
    # Tauri v2 prerequisites (webkit2gtk 4.1) plus what the desktop crate adds: libxdo (input), libx11/libxi/libxtst (device_query, idle detection)
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libx11-dev libxi-dev libxtst-dev libxdo-dev libssl-dev patchelf file
