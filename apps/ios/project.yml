name: WizardChat
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  WizardChatCore:
    path: WizardChatCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

# Team, bundle IDs and the app group come from Config/Signing.xcconfig (overridable per developer)
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: $(WZ_TEAM)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'

targets:
  WizardChat:
    type: application
    platform: iOS
    sources:
      - WizardChat
      - Shared
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/icons/dist/apple/Icons.xcassets
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
      - path: ../../packages/emoji/dist/emoji.json
        buildPhase: resources
      - path: ../../packages/sounds/raw
        buildPhase: resources
    info:
      path: WizardChat/Info.plist
      properties:
        # Keep voice room audio running with the screen off or the app in the background
        UIBackgroundModes: [audio, voip, fetch]
        # Opened by the share extension to send what you shared
        CFBundleURLTypes:
          - CFBundleURLName: org.wizardchat.ios
            CFBundleURLSchemes: [wizardchat]
        # Background checks for new messages (until there's push)
        BGTaskSchedulerPermittedIdentifiers: [org.wizardchat.ios.refresh]
        # Calls show in the Dynamic Island and on the lock screen
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        CFBundleLocalizations: [en, de]
    dependencies:
      - package: WizardChatCore
      - package: LiveKit
      - target: WizardChatWidgets
      - target: WizardChatShare
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).ios
        CODE_SIGN_ENTITLEMENTS: WizardChat/WizardChat.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WizardChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Usage descriptions are iOS-only text, so they live here rather than in packages/i18n
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'WizardChat uses the microphone for voice rooms and voice messages.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'WizardChat uses the camera for video in voice rooms and calls.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'WizardChat uses your location when you choose to share it in a chat.'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'AppIcon-Parrot AppIcon-Hallow'
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Live Activities: the call in the Dynamic Island and on the lock screen
  WizardChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WizardChatWidgets
      - Shared
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/icons/dist/apple/Icons.xcassets
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
    info:
      path: WizardChatWidgets/Info.plist
      properties:
        CFBundleDisplayName: WizardChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).ios.widgets
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # "Share -> WizardChat" from Photos, Safari and other apps
  WizardChatShare:
    type: app-extension
    platform: iOS
    sources:
      - WizardChatShare
      - path: Shared/ShareInbox.swift
      - path: Shared/L10n.swift
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
    info:
      path: WizardChatShare/Info.plist
      properties:
        CFBundleDisplayName: WizardChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).ios.share
        CODE_SIGN_ENTITLEMENTS: WizardChatShare/WizardChatShare.entitlements
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
