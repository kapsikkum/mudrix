name: WizardChat
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  WizardChatCore:
    path: WizardChatCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

# Team, bundle IDs and the app group come from Config/Signing.xcconfig (overridable per developer)
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: $(WZ_TEAM)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'

targets:
  WizardChat:
    type: application
    platform: iOS
    sources:
      - WizardChat
      - Shared
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/design-tokens/dist/apple/Tokens.xcassets
      - ../../packages/icons/dist/apple/Icons.xcassets
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
      - path: ../../packages/emoji/dist/emoji.json
        buildPhase: resources
      - path: ../../packages/sounds/raw
        buildPhase: resources
      - path: ../../whatsnew
        type: folder
        buildPhase: resources
    info:
      path: WizardChat/Info.plist
      properties:
        # The theme's background, so launching doesn't flash white before the first frame
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Keep voice room audio running with the screen off or the app in the background
        # remote-notification: silent pushes (apns mode); fetch: BGAppRefreshTask syncs (keepalive mode)
        UIBackgroundModes: [audio, remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [chat.mudrix.mobile.refresh]
        # How notifications arrive while closed: apns (needs a push gateway and the Push capability) or keepalive
        WZPushMode: $(WZ_PUSH_MODE)
        WZPushGateway: $(WZ_PUSH_GATEWAY_URL)
        # Opened by the share extension to send what you shared
        CFBundleURLTypes:
          - CFBundleURLName: chat.mudrix.mobile
            CFBundleURLSchemes: [mudrix]
        # Calls show in the Dynamic Island and on the lock screen
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        # GIF search key from Config/Secrets.xcconfig or the GIPHY_API_KEY build setting; empty turns the GIF picker off
        WZGiphyApiKey: $(GIPHY_API_KEY)
        CFBundleLocalizations: [en, de, es, fr, it, pt, ru, ja, tr, nl, pl]
        # End-to-end encryption uses standard algorithms in open-source code, which is exempt
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: WizardChatCore
      - package: LiveKit
      - target: WizardChatWidgets
      - target: WizardChatShare
    scheme:
      testTargets:
        - WizardChatTests
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).mobile
        CODE_SIGN_ENTITLEMENTS: $(WZ_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mudrix
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Usage descriptions are iOS-only text, so they live here rather than in packages/i18n
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Mudrix uses your microphone for calls, voice rooms and voice messages.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Mudrix uses your camera for video calls and to scan QR codes when you sign in.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'Mudrix uses your location only when you share it in a chat.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Mudrix saves the photos you choose from a chat to your photo library.'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'AppIcon-Parrot AppIcon-Hallow AppIcon-Ethereal AppIcon-Pewter AppIcon-Umbra AppIcon-Eclipse AppIcon-Garnet AppIcon-Blossom'
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Live Activities: the call in the Dynamic Island and on the lock screen
  WizardChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WizardChatWidgets
      - Shared
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/icons/dist/apple/Icons.xcassets
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
    info:
      path: WizardChatWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mudrix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).mobile.widgets
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # "Share -> Mudrix" from Photos, Safari and other apps
  WizardChatShare:
    type: app-extension
    platform: iOS
    sources:
      - WizardChatShare
      - path: Shared/ShareInbox.swift
      - path: Shared/L10n.swift
      - ../../packages/design-tokens/dist/swift/WizardChatTokens.swift
      - ../../packages/i18n/dist/apple/Localizable.xcstrings
    info:
      path: WizardChatShare/Info.plist
      properties:
        CFBundleDisplayName: Mudrix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WZAppGroup: $(WZ_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    postBuildScripts:
      - name: Version from package.json
        script: ./scripts/set-version.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).mobile.share
        CODE_SIGN_ENTITLEMENTS: WizardChatShare/WizardChatShare.entitlements
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Unit tests of the pure parts (theme derivation, settings sync, video plan, image strip), run inside the app
  WizardChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WizardChatTests
    dependencies:
      - target: WizardChat
      - package: WizardChatCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WZ_BUNDLE_PREFIX).mobile.tests
