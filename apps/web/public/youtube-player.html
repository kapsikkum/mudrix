<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Mudrix YouTube player</title>
    <style>
      html,
      body,
      #player {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      // Hosts the YouTube player on a web origin for Mudrix's watch together (desktop)
      (function () {
        var SOURCE = 'wizardchat-youtube';
        var player = null;
        var ready = false;
        var queue = [];

        function post(message) {
          message.source = SOURCE;
          window.parent.postMessage(message, '*');
        }

        // The video the app asked for. While an advert plays, the player reports something else, and
        // its time and length are the advert's, so none of them can be used to follow the room.
        var wanted = null;

        function playingAdvert(data) {
          try {
            if (typeof player.getAdState === 'function' && player.getAdState() === 1) return true;
          } catch (e) {
            // not offered by this player
          }
          if (!wanted) return false;
          if (data && data.video_id && data.video_id !== wanted) return true;
          var url = player.getVideoUrl ? player.getVideoUrl() : '';
          return !!url && url.indexOf(wanted) === -1;
        }

        // Adverts are far louder than the video, so they play muted. Only a mute made here is undone
        // here, so someone who had muted the video themselves is left as they were.
        var mutedForAdvert = false;

        function muteAdverts(advert) {
          try {
            if (advert && !mutedForAdvert && !player.isMuted()) {
              player.mute();
              mutedForAdvert = true;
            } else if (!advert && mutedForAdvert) {
              player.unMute();
              mutedForAdvert = false;
            }
          } catch (e) {
            // the player is not ready to be asked
          }
        }

        function status() {
          if (!ready) return;
          var data = player.getVideoData ? player.getVideoData() : {};
          var advert = playingAdvert(data);
          muteAdverts(advert);
          post({
            type: 'status',
            time: player.getCurrentTime(),
            state: player.getPlayerState(),
            duration: player.getDuration(),
            videoId: wanted || (data && data.video_id),
            advert: advert,
            rate: player.getPlaybackRate ? player.getPlaybackRate() : 1,
            loaded: player.getVideoLoadedFraction ? player.getVideoLoadedFraction() : null,
          });
        }

        function run(command) {
          if (!ready) {
            queue.push(command);
            return;
          }
          if (command.type === 'play') player.playVideo();
          else if (command.type === 'pause') player.pauseVideo();
          else if (command.type === 'seek') player.seekTo(command.seconds, true);
          else if (command.type === 'rate') player.setPlaybackRate(command.rate);
          else if (command.type === 'load' || command.type === 'cue') {
            wanted = command.videoId;
            var args = { videoId: command.videoId, startSeconds: command.seconds };
            if (command.type === 'load') player.loadVideoById(args);
            else player.cueVideoById(args);
          }
          status();
        }

        function create(options) {
          if (player) return;
          wanted = options.videoId;
          window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
              host: 'https://www.youtube-nocookie.com',
              width: '100%',
              height: '100%',
              videoId: options.videoId,
              playerVars: {
                autoplay: options.autoplay ? 1 : 0,
                start: Math.floor(options.start || 0),
                playsinline: 1,
                rel: 0,
              },
              events: {
                onReady: function () {
                  ready = true;
                  post({ type: 'ready' });
                  queue.splice(0).forEach(run);
                  status();
                },
                onStateChange: function (event) {
                  status();
                  post({ type: 'state', state: event.data });
                },
                onPlaybackRateChange: function (event) {
                  status();
                  post({ type: 'rate', rate: event.data });
                },
                onError: function (event) {
                  post({ type: 'error', code: event.data });
                },
              },
            });
          };
          var script = document.createElement('script');
          script.src = 'https://www.youtube.com/iframe_api';
          script.onerror = function () {
            post({ type: 'error', code: -1 });
          };
          document.head.appendChild(script);
          setInterval(status, 250);
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var command = event.data;
          if (!command || command.target !== SOURCE) return;
          if (command.type === 'init') create(command);
          else run(command);
        });

        post({ type: 'loaded' });
      })();
    </script>
  </body>
</html>
