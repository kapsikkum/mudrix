<!doctype html>
<html lang="en">
  <head>
    <script src="%BASE_URL%frame-guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11111e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mudrix" />
    <title>Mudrix</title>
    <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/images/logo.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #11111e;
      }
      #loading-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #loading-shell::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-shell">
        <img src="/assets/images/logo.svg" width="80" height="80" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
