stages:
  - lint
  - prepare
  - validate
  - build
  - deploy
  - release

variables:
  DRY_RUN: 'false'
  VERSION: ''

lint:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^prepare\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint-desktop:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files:
        - desktop/package-lock.json
    paths:
      - desktop/node_modules/
  before_script:
    - cd desktop
    - npm ci --ignore-scripts
  script:
    - npx tsc -p tsconfig.json --noEmit
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^prepare\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
      changes:
        - desktop/**/*

prepare-release:
  stage: prepare
  image: node:22-alpine
  before_script:
    - apk add --no-cache git curl
    - |
      if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "ERROR: VERSION must match vYY.MM.PATCH (e.g. v26.5.0). Got: $VERSION"
        exit 1
      fi
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      BRANCH="prepare/${VERSION}"
      VERSION_BARE="${VERSION#v}"
      echo "=== Preparing stable release ${VERSION} ==="
      git checkout -b "$BRANCH"
      npm version "$VERSION_BARE" --no-git-tag-version
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: showing diff, skipping commit + MR ==="
        git diff
        exit 0
      fi
      git add package.json package-lock.json
      git commit -m "chore(release): prepare ${VERSION}"
      git push origin "$BRANCH" --force
      echo "=== Creating tag ${VERSION} ==="
      git tag -f "$VERSION" HEAD
      git push origin "$VERSION" --force
      curl --silent --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"chore(release): prepare ${VERSION}\",
          \"description\": \"Bumps \`package.json\` to \`${VERSION_BARE}\`.\",
          \"labels\": \"release\",
          \"assignee_id\": ${GITLAB_USER_ID},
          \"remove_source_branch\": true,
          \"squash\": true
        }" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
      echo "=== MR created for ${VERSION} ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $VERSION =~ /^v\d+\.\d+\.\d+$/'

prepare-release-next:
  stage: prepare
  image: node:22-alpine
  before_script:
    - apk add --no-cache git curl
    - |
      if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$'; then
        echo "ERROR: VERSION must match vYY.MM.PATCH-next.N (e.g. v26.5.0-next.1). Got: $VERSION"
        exit 1
      fi
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      BRANCH="prepare/${VERSION}"
      VERSION_BARE="${VERSION#v}"
      echo "=== Preparing next pre-release ${VERSION} ==="
      git checkout -b "$BRANCH"
      npm version "${VERSION_BARE}" --no-git-tag-version
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: showing diff, skipping commit + MR ==="
        git diff
        exit 0
      fi
      git add package.json package-lock.json
      git commit -m "chore(release): prepare ${VERSION}"
      git push origin "$BRANCH" --force
      echo "=== Creating tag ${VERSION} ==="
      git tag -f "$VERSION" HEAD
      git push origin "$VERSION" --force
      curl --silent --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"chore(release): prepare ${VERSION}\",
          \"description\": \"Bumps \`package.json\` to \`${VERSION_BARE}\`.\",
          \"labels\": \"release,pre-release\",
          \"assignee_id\": ${GITLAB_USER_ID},
          \"remove_source_branch\": true,
          \"squash\": true
        }" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
      echo "=== MR created for ${VERSION} ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $VERSION =~ /^v\d+\.\d+\.\d+-next\.\d+$/'

validate-and-build:
  stage: validate
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run build
    - apk add --no-cache git
    - git fetch --tags
    - git fetch --unshallow
    - |
      PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}$" | grep -v '\-next\.' | head -n 1 || true)
      if [ -z "$PREV_TAG" ]; then
        RANGE="${CI_COMMIT_SHA}"
        PREV_LABEL="the beginning of the project"
      else
        RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
        PREV_LABEL="${PREV_TAG}"
      fi
      COMMITS=$(git log "$RANGE" --pretty=format:"%h %s" --no-merges)
      section() {
        LABEL="$1"; shift
        LINES=""
        for PREFIX in "$@"; do
          MATCHES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ ${PREFIX}" || true)
          if [ -n "$MATCHES" ]; then
            LINES=$(printf '%s\n%s' "$LINES" "$MATCHES")
          fi
        done
        LINES=$(echo "$LINES" | grep -v '^[[:space:]]*$' || true)
        if [ -n "$LINES" ]; then
          printf "\n### %s\n" "$LABEL"
          echo "$LINES" | while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            printf -- "- %s ([%s](https://gitlab.com/%s/-/commit/%s))\n" "$MSG" "$SHA" "$CI_PROJECT_PATH" "$SHA"
          done
        fi
      }
      OTHER=$(echo "$COMMITS" | grep -ivE "^[a-f0-9]+ (feat|fix|perf|refactor|docs|chore|ci|test|build|style|revert)" || true)
      {
        printf "## What's Changed\n"
        printf "\nComparing [%s...%s](https://gitlab.com/%s/-/compare/%s...%s)\n" \
          "$PREV_LABEL" "$CI_COMMIT_TAG" "$CI_PROJECT_PATH" "${PREV_TAG:-}" "$CI_COMMIT_TAG"
        section "New Features"       "feat(\([^)]*\))?!?:"
        section "Bug Fixes"          "fix(\([^)]*\))?!?:"
        section "Performance"        "perf(\([^)]*\))?!?:"
        section "Refactoring"        "refactor(\([^)]*\))?!?:"
        section "Documentation"      "docs(\([^)]*\))?!?:"
        section "Chores & Internals" "chore(?!\(release\))(\([^)]*\))?!?:" "ci(\([^)]*\))?!?:" "build(\([^)]*\))?!?:" "test(\([^)]*\))?!?:" "style(\([^)]*\))?!?:"
        section "Reverts"            "revert(\([^)]*\))?!?:"
        if [ -n "$OTHER" ]; then
          printf "\n### Other\n"
          echo "$OTHER" | while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            printf -- "- %s ([%s](https://gitlab.com/%s/-/commit/%s))\n" "$MSG" "$SHA" "$CI_PROJECT_PATH" "$SHA"
          done
        fi
        printf "\n---\n"
        printf "_Released: %s_\n" "$(date -u '+%Y-%m-%d')"
      } > release-notes.md
  artifacts:
    paths:
      - release-notes.md
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - validate-and-build
    - build-docker
    - deploy
    - upload-desktop
  dependencies:
    - validate-and-build
    - upload-desktop
  script:
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY RUN: GitLab release creation skipped"
        cat release-notes.md
      else
        # Desktop installers from upload-desktop as release downloads
        ASSETS=$(cat desktop-assets.json)
        if [ "$ASSETS" != "[]" ]; then set -- --assets-link "$ASSETS"; fi
        release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$(cat release-notes.md)" --ref "$CI_COMMIT_SHA" "$@"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success

build-docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  needs:
    - job: validate-and-build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - |
      docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: image built but not pushed ==="
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

validate-and-build-next:
  stage: validate
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run build
    - apk add --no-cache git
    - git fetch --tags
    - git fetch --unshallow
    - |
      PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}$" | head -n 1 || true)
      if [ -z "$PREV_TAG" ]; then
        RANGE="${CI_COMMIT_SHA}"
        PREV_LABEL="the beginning of the project"
      else
        RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
        PREV_LABEL="${PREV_TAG}"
      fi
      COMMITS=$(git log "$RANGE" --pretty=format:"%h %s" --no-merges)
      section() {
        LABEL="$1"; shift
        LINES=""
        for PREFIX in "$@"; do
          MATCHES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ ${PREFIX}" || true)
          if [ -n "$MATCHES" ]; then
            LINES=$(printf '%s\n%s' "$LINES" "$MATCHES")
          fi
        done
        LINES=$(echo "$LINES" | grep -v '^[[:space:]]*$' || true)
        if [ -n "$LINES" ]; then
          printf "\n### %s\n" "$LABEL"
          echo "$LINES" | while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            printf -- "- %s ([%s](https://gitlab.com/%s/-/commit/%s))\n" "$MSG" "$SHA" "$CI_PROJECT_PATH" "$SHA"
          done
        fi
      }
      OTHER=$(echo "$COMMITS" | grep -ivE "^[a-f0-9]+ (feat|fix|perf|refactor|docs|chore|ci|test|build|style|revert)" || true)
      {
        printf "## Pre-release %s\n" "$CI_COMMIT_TAG"
        printf "\n> **This is a pre-release.** It may be unstable and is intended for testing purposes.\n"
        printf "\nComparing [%s...%s](https://gitlab.com/%s/-/compare/%s...%s)\n" \
          "$PREV_LABEL" "$CI_COMMIT_TAG" "$CI_PROJECT_PATH" "${PREV_TAG:-}" "$CI_COMMIT_TAG"
        section "New Features"       "feat(\([^)]*\))?!?:"
        section "Bug Fixes"          "fix(\([^)]*\))?!?:"
        section "Performance"        "perf(\([^)]*\))?!?:"
        section "Refactoring"        "refactor(\([^)]*\))?!?:"
        section "Documentation"      "docs(\([^)]*\))?!?:"
        section "Chores & Internals" "chore(?!\(release\))(\([^)]*\))?!?:" "ci(\([^)]*\))?!?:" "build(\([^)]*\))?!?:" "test(\([^)]*\))?!?:" "style(\([^)]*\))?!?:"
        section "Reverts"            "revert(\([^)]*\))?!?:"
        if [ -n "$OTHER" ]; then
          printf "\n### Other\n"
          echo "$OTHER" | while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            printf -- "- %s ([%s](https://gitlab.com/%s/-/commit/%s))\n" "$MSG" "$SHA" "$CI_PROJECT_PATH" "$SHA"
          done
        fi
        printf "\n---\n"
        printf "_Pre-release date: %s_\n" "$(date -u '+%Y-%m-%d')"
      } > release-notes.md
  artifacts:
    paths:
      - release-notes.md
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-next\.\d+$/'

create-release-next:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - validate-and-build-next
    - build-docker-next
    - deploy-next
    - upload-desktop
  dependencies:
    - validate-and-build-next
    - upload-desktop
  script:
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY RUN: GitLab pre-release creation skipped"
        cat release-notes.md
      else
        # Desktop installers from upload-desktop as release downloads
        ASSETS=$(cat desktop-assets.json)
        if [ "$ASSETS" != "[]" ]; then set -- --assets-link "$ASSETS"; fi
        release-cli create --name "Pre-release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$(cat release-notes.md)" --ref "$CI_COMMIT_SHA" "$@"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-next\.\d+$/'
      when: on_success

build-docker-next:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  needs:
    - job: validate-and-build-next
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - |
      docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: image built but not pushed ==="
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-next\.\d+$/'

deploy:
  stage: deploy
  image: node:22-alpine
  dependencies:
    - validate-and-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
  variables:
    FEED_ORIGIN: https://app.wizardchat.org
  before_script:
    - apk add --no-cache nodejs npm curl
    - npm install -g wrangler
  script:
    # Keep the desktop update files of the last release: deploy-desktop-feed replaces them once
    # this release's installers are uploaded (if a desktop build fails, the old ones stay live)
    - |
      mkdir -p dist/desktop
      for f in latest.yml latest-mac.yml latest-linux.yml; do
        if curl -fsS "${FEED_ORIGIN}/desktop/$f" -o "/tmp/$f" && grep -q '^version:' "/tmp/$f"; then
          cp "/tmp/$f" dist/desktop/
        fi
      done
    - wrangler pages deploy dist/ --project-name=wizardchat --branch=main --commit-hash=$CI_COMMIT_SHA
  environment:
    name: production
    url: https://app.wizardchat.org

deploy-next:
  stage: deploy
  image: node:22-alpine
  dependencies:
    - validate-and-build-next
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-next\.\d+$/'
      when: on_success
  variables:
    FEED_ORIGIN: https://next.wizardchat.org
  before_script:
    - apk add --no-cache nodejs npm curl
    - npm install -g wrangler
  script:
    # Keep the desktop update files of the last release: deploy-desktop-feed replaces them once
    # this release's installers are uploaded (if a desktop build fails, the old ones stay live)
    - |
      mkdir -p dist/desktop
      for f in latest.yml latest-mac.yml latest-linux.yml; do
        if curl -fsS "${FEED_ORIGIN}/desktop/$f" -o "/tmp/$f" && grep -q '^version:' "/tmp/$f"; then
          cp "/tmp/$f" dist/desktop/
        fi
      done
    - wrangler pages deploy dist/ --project-name=wizardchat-next --branch=main --commit-hash=$CI_COMMIT_SHA
  environment:
    name: next
    url: https://next.wizardchat.org

# ── Desktop (Electron, desktop/) ─────────────────────────────────────────────────────────────
# Same tag, same version (root package.json, read by desktop/electron-builder.cjs). Builds use the
# web build of this pipeline; installers go to the package registry and the GitLab release, the
# update files to <app|next>.wizardchat.org/desktop/ (deploy-desktop-feed).

.desktop-release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-next\.\d+)?$/'

.desktop-build:
  stage: build
  extends: .desktop-release-rules
  needs:
    - job: validate-and-build
      optional: true
    - job: validate-and-build-next
      optional: true
  script:
    - cd desktop
    - npm ci --ignore-scripts
    - npm run build:electron
    - npx electron-builder --$DESKTOP_PLATFORM --publish=never
  artifacts:
    # Top-level files only (installers, blockmaps, latest*.yml), not the unpacked app folders
    paths:
      - desktop/release/*.*
    expire_in: 1 day

build-desktop-mac:
  extends: .desktop-build
  tags: [saas-macos-medium-m1]
  variables:
    DESKTOP_PLATFORM: mac

build-desktop-linux:
  extends: .desktop-build
  image: node:22
  variables:
    DESKTOP_PLATFORM: linux

build-desktop-win:
  extends: .desktop-build
  tags: [saas-windows-medium-amd64]
  variables:
    DESKTOP_PLATFORM: win
  script:
    - cd desktop
    - npm ci --ignore-scripts
    - npm run build:electron
    - npx electron-builder --win --publish=never

upload-desktop:
  stage: deploy
  image: alpine:3
  extends: .desktop-release-rules
  needs:
    - build-desktop-mac
    - build-desktop-linux
    - build-desktop-win
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo '[]' > desktop-assets.json
      for f in desktop/release/*; do
        name=$(basename "$f")
        case "$name" in builder-*) continue ;; esac
        url="https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/wizardchat-desktop/${CI_COMMIT_TAG}/$(printf '%s' "$name" | jq -sRr @uri)"
        if [ "$DRY_RUN" = "true" ]; then
          echo "DRY RUN: would upload $name"
        else
          curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        fi
        # Installers are listed on the release page; blockmaps and update files only live in the registry
        case "$name" in
          *.exe|*.dmg|*.AppImage)
            jq --arg name "$name" --arg url "$url" '. + [{name: $name, url: $url, link_type: "package"}]' \
              desktop-assets.json > desktop-assets.tmp && mv desktop-assets.tmp desktop-assets.json ;;
        esac
      done
      cat desktop-assets.json
  artifacts:
    paths:
      - desktop-assets.json
    expire_in: 1 day

deploy-desktop-feed:
  stage: deploy
  image: node:22-alpine
  extends: .desktop-release-rules
  # One feed deploy at a time per project
  resource_group: desktop-feed
  needs:
    - job: validate-and-build
      optional: true
    - job: validate-and-build-next
      optional: true
    - job: deploy
      optional: true
      artifacts: false
    - job: deploy-next
      optional: true
      artifacts: false
    - build-desktop-mac
    - build-desktop-linux
    - build-desktop-win
    - job: upload-desktop
      artifacts: false
  before_script:
    - npm install -g wrangler
  script:
    # The same web build as the web deploy, plus this release's update files
    - node desktop/scripts/write-update-feed.mjs desktop/release dist
    - |
      case "$CI_COMMIT_TAG" in
        *-next.*) PROJECT=wizardchat-next ;;
        *) PROJECT=wizardchat ;;
      esac
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY RUN: would deploy dist/ with desktop/ to $PROJECT"
        ls dist/desktop
      else
        wrangler pages deploy dist/ --project-name="$PROJECT" --branch=main --commit-hash=$CI_COMMIT_SHA
      fi
